# =============================================
# 订单服务 Bootstrap 配置
# 用于从 Nacos 获取配置（优先级高于 application.yml）
# =============================================

spring:
  # 服务名称，必须与 application.yml 中的名称一致
  application:
    name: order-service

  # =============================================
  # Spring Cloud 配置
  # =============================================
  cloud:
    nacos:
      # ---------- 服务发现配置 ----------
      # 订单服务启动后会自动注册到 Nacos，其他服务可以通过服务名调用
      discovery:
        # Nacos 服务器地址
        server-addr: localhost:8848
        # 命名空间（用于环境隔离：dev/test/prod）
        namespace: ms-demo
        # 配置分组
        group: DEFAULT_GROUP
        # 注册的服务名（默认使用 spring.application.name）
        service: ${spring.application.name}

      # ---------- 配置中心配置 ----------
      # 从 Nacos 拉取配置文件，实现配置的动态管理
      config:
        # Nacos 服务器地址
        server-addr: localhost:8848
        # 命名空间
        namespace: ms-demo
        # 配置分组
        group: DEFAULT_GROUP
        # 配置文件扩展名（支持 yml 和 properties）
        file-extension: yml
        # ---------- 共享配置 ----------
        # 多个微服务共用的配置（如数据源、Redis 等）
        shared-configs:
          # data-id: 配置文件的 Data ID
          # group: 配置分组
          # refresh: 是否支持动态刷新（配置变更后自动生效）
          - data-id: common-config.yml
            group: DEFAULT_GROUP
            refresh: true