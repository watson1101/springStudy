<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO单点登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input.error {
            border-color: #e74c3c;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .demo-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }
        
        .demo-info h4 {
            margin-bottom: 8px;
            color: #333;
        }
        
        .demo-info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .redirect-info {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 6px;
            font-size: 12px;
            color: #1976d2;
            word-break: break-all;
        }
        
        .sso-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="sso-logo">S</div>
            <h1>SSO单点登录</h1>
            <p>统一身份认证平台</p>
        </div>
        
        <form id="loginForm" th:action="@{/sso/login}" method="post">
            <input type="hidden" name="redirectUri" th:value="${redirectUri}" />
            <input type="hidden" name="clientId" th:value="${clientId}" />
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" />
                <div class="error-message" id="usernameError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" />
                <div class="error-message" id="passwordError"></div>
            </div>
            
            <button type="submit" class="btn btn-primary">登录</button>
        </form>
        
        <div class="demo-info">
            <h4>演示账号</h4>
            <p>用户名: <code>admin</code></p>
            <p>密码: <code>123456</code></p>
        </div>
        
        <div th:if="${redirectUri}" class="redirect-info">
            <strong>回调地址:</strong><br/>
            <span th:text="${redirectUri}"></span>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var error = urlParams.get('error');
            
            if (error) {
                var decodedError = decodeURIComponent(error);
                var passwordInput = document.getElementById('password');
                var passwordError = document.getElementById('passwordError');
                
                passwordInput.classList.add('error');
                passwordError.textContent = decodedError;
                passwordError.classList.add('show');
            }
            
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value.trim();
                var isValid = true;
                
                document.getElementById('usernameError').classList.remove('show');
                document.getElementById('passwordError').classList.remove('show');
                document.getElementById('username').classList.remove('error');
                document.getElementById('password').classList.remove('error');
                
                if (!username) {
                    document.getElementById('usernameError').textContent = '请输入用户名';
                    document.getElementById('usernameError').classList.add('show');
                    document.getElementById('username').classList.add('error');
                    isValid = false;
                }
                
                if (!password) {
                    document.getElementById('passwordError').textContent = '请输入密码';
                    document.getElementById('passwordError').classList.add('show');
                    document.getElementById('password').classList.add('error');
                    isValid = false;
                }
                
                if (!isValid) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
