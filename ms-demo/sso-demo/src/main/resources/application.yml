server:
  port: 8006
  servlet:
    context-path: /

spring:
  application:
    name: sso-demo
  
  thymeleaf:
    enabled: true
    encoding: UTF-8
    mode: HTML
    cache: false
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

sso:
  server:
    url: http://localhost:8006
    jwt-secret: sso-demo-jwt-secret-key-2026
    token-expire-seconds: 7200
    persist-token: true
  
  client:
    client-id: sso-demo-client
    client-secret: sso-demo-client-secret
    server-url: http://localhost:8006
    callback-url: http://localhost:8006/sso/callback
    protected-paths:
      - /**
    ignore-paths:
      - /sso/login
      - /sso/callback
      - /sso/validate
      - /sso/logout
      - /sso/api/login
      - /sso/userinfo
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api/client-config
      - /error

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    msdemo.hong.com.ssodemo: DEBUG
    org.springframework.web: INFO