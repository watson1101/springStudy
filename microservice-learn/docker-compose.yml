# 基础设施：Nacos 注册/配置中心
# Sentinel 控制台已迁移到 K8s（NodePort 192.168.0.27:30858），如需恢复取消注释
# 启动：docker compose up -d
version: "3.8"

services:
  nacos:
    image: nacos/nacos-server:latest
    container_name: ms-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ms-learn-key
      NACOS_AUTH_IDENTITY_VALUE: ms-learn-secret
      NACOS_AUTH_TOKEN: "MSk5OWU4N2Y2ZWM0ZjVhY2IwMDU0MTAwMGJi"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: always

  # sentinel-dashboard:
  #   image: bladex/sentinel-dashboard
  #   container_name: ms-sentinel
  #   environment:
  #     JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=127.0.0.1:8858"
  #   ports:
  #     - "8858:8858"
  #   restart: always

volumes:
  nacos-data:
  nacos-logs:
