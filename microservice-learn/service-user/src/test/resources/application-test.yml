spring:
  datasource:
    url: jdbc:h2:mem:user_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.alibaba.cloud.nacos: warn
    com.ms.learn.user: warn
