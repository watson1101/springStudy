server:
  port: 8008

spring:
  application:
    name: service-hotnews-collector
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:service-hotnews-collector.yaml
  cloud:
    nacos:
      server-addr: 192.168.0.27:8848
      # 真实值优先取环境变量；未注入时回退到默认值
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: public
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
# RocketMQ 配置
rocketmq:
  name-server: 192.168.0.27:9876
  producer:
    group: hotnews-producer-group
    send-message-timeout: 5000

# 采集配置（此处为本地兜底默认值，实际以 Nacos 配置为准）
hotnews:
  collect:
    cron: "0 0/30 * * * ?"
    enabled: true
    url: "https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc"
    timeout: 10000
  mq:
    topic: hotnews-topic

logging:
  level:
    com.ms.learn: debug
    org.apache.rocketmq: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
