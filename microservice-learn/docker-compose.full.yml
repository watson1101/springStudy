# 完整部署：基础设施 + 全量微服务 + 前端
# 前提：先 mvn clean package 打包出各服务 jar
# 启动：docker compose -f docker-compose.full.yml up -d --build
version: "3.8"

services:
  nacos:
    image: nacos/nacos-server:latest
    container_name: ms-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ms-learn-key
      NACOS_AUTH_IDENTITY_VALUE: ms-learn-secret
      NACOS_AUTH_TOKEN: "MSk5OWU4N2Y2ZWM0ZjVhY2IwMDU0MTAwMGJi"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: always

  sentinel-dashboard:
    image: bladex/sentinel-dashboard
    container_name: ms-sentinel
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=127.0.0.1:8858"
    ports:
      - "8858:8858"
    restart: always

  service-user:
    build:
      context: .
      dockerfile: service-user/Dockerfile
    container_name: ms-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8001:8001"
    depends_on:
      - nacos
    restart: always

  service-order:
    build:
      context: .
      dockerfile: service-order/Dockerfile
    container_name: ms-order
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8002:8002"
    depends_on:
      - nacos
    restart: always

  service-product:
    build:
      context: .
      dockerfile: service-product/Dockerfile
    container_name: ms-product
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8003:8003"
    depends_on:
      - nacos
    restart: always

  ms-ds-system:
    build:
      context: .
      dockerfile: ms-ds-system/Dockerfile
    container_name: ms-ds-system
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      - nacos
    restart: always

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ms-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8000:8000"
    depends_on:
      - nacos
    restart: always

volumes:
  nacos-data:
  nacos-logs:
