server:
  port: 8009

spring:
  application:
    name: service-hotnews-consumer
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://192.168.0.27:3306/ms_ds_hotnews?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 真实值优先取环境变量；未注入时回退到默认值（本地/服务器直跑可用）
    # k8s 由 Deployment 的 SPRING_DATASOURCE_* 环境变量覆盖（Spring 自动映射）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import:
      - optional:nacos:service-hotnews-consumer.yaml
  cloud:
    nacos:
      server-addr: 192.168.0.27:8848
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: public
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

# RocketMQ 配置
rocketmq:
  name-server: 192.168.0.27:9876
  consumer:
    group: hotnews-consumer-group

# 消费配置
hotnews:
  mq:
    topic: hotnews-topic
    consumer-group: hotnews-consumer-group

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id   # 雪花算法
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.ms.learn: debug
    org.apache.rocketmq: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
