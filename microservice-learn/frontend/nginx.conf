user nginx;
worker_processes auto;

# pid 路径：nginx 非 root (uid=101) 运行时能写
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 16m;

    # 日志输出到 stdout/stderr，便于 kubectl logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # k3s CoreDNS 地址：用于「变量延迟解析」上游域名
    # 关键：proxy_pass 用变量时，nginx 启动阶段不解析域名，只在实际请求时解析，
    # 因此集群内后端服务尚未部署时，nginx 也能正常启动（否则会 [emerg] 退出）。
    resolver 10.43.0.10 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ---- 健康检查（K8s liveness/readinessProbe）----
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # ---- /api/ 反代到集群内部 ms-gateway ----
        # 前端浏览器从外部只能访问 NodePort 30081，前端页面内发起的 /api/* 请求
        # 先到 nginx，再由 nginx 通过 K8s 内部 DNS 直连 ms-gateway Service，
        # 避免浏览器直连网关 NodePort 出现 CORS/端口不一致问题。
        #
        # 注意：使用变量 $gateway_upstream 让 nginx 在运行时（而非启动时）解析域名。
        location /api/ {
            set $gateway_upstream "ms-gateway.ms-learn.svc.cluster.local:8000";
            proxy_pass         http://$gateway_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---- SSO 入口路径（service-user 中 /sso/*）----
        # 统一走网关转发（网关已配置 /sso/** → lb://service-user），
        # 不再直连 service-user，避免多一个硬依赖；同样使用变量延迟解析。
        location /sso/ {
            set $sso_upstream "ms-gateway.ms-learn.svc.cluster.local:8000";
            proxy_pass         http://$sso_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---- Vue SPA history 模式：路径不存在时回退到 index.html ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态文件缓存（Vite 打包文件名带 hash，可放心强缓存）
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
