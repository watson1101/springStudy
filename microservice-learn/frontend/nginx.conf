user nginx;
worker_processes auto;

# pid 路径：nginx 非 root (uid=101) 运行时能写
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 16m;

    # 日志输出到 stdout/stderr，便于 kubectl logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ---- 健康检查（K8s liveness/readinessProbe）----
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # ---- /api/ 反代到集群内部 ms-gateway ----
        # 前端浏览器从外部只能访问 NodePort 30081，前端页面内发起的 /api/* 请求
        # 先到 nginx，再由 nginx 通过 K8s 内部 DNS 直连 ms-gateway Service，
        # 避免浏览器直连网关 NodePort 出现 CORS/端口不一致问题。
        location /api/ {
            proxy_pass         http://ms-gateway.ms-learn.svc.cluster.local:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---- SSO 入口路径（service-user 中 /sso/*）一并反代，避免前端直接跨域 ----
        location /sso/ {
            proxy_pass         http://service-user.ms-learn.svc.cluster.local:8001/sso/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---- Vue SPA history 模式：路径不存在时回退到 index.html ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态文件缓存（Vite 打包文件名带 hash，可放心强缓存）
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
