# ===================================================================
# hotnews-db-secret: 热点资讯模块数据库凭据（示例模板）
#
# ⚠️ 本文件仅为模板，不含真实凭据，可安全提交。
#    真实 Secret 请勿提交到 Git，直接在集群内创建：
#
#    kubectl create secret generic hotnews-db-secret -n ms-learn \
#      --from-literal=username='<你的用户名>' \
#      --from-literal=password='<你的密码>'
#
#    或复制本文件为 19c-hotnews-db-secret.yaml（已在 .gitignore 中排除）
#    再填入真实值后 apply。
# ===================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hotnews-db-secret
  namespace: ms-learn
  labels:
    part-of: ms-learn
type: Opaque
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
