# ===================================================================
# flowable-service: Flowable 工作流服务
#   端口 8007，ClusterIP 内部可见
#   Flowable 引擎初始化 + BPMN 自动建表，偏内存密集
#   关闭多余子引擎：idm / event-registry / cmmn / dmn / form / content / app
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowable-service
  namespace: ms-learn
  labels:
    app: flowable-service
    tier: backend
    part-of: ms-learn
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flowable-service
  template:
    metadata:
      labels:
        app: flowable-service
        tier: backend
        part-of: ms-learn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: flowable-service
          image: localhost:5000/ms-learn/flowable-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/ms_ds_flowable?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: ms-learn-common
            - secretRef:
                name: ms-learn-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8007
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8007
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 理由：Flowable 引擎初始化+建表占内存；初始等待时间更长
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 800m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flowable-service
  namespace: ms-learn
  labels:
    app: flowable-service
    part-of: ms-learn
spec:
  type: ClusterIP
  selector:
    app: flowable-service
  ports:
    - name: http
      port: 8007
      targetPort: http
      protocol: TCP
