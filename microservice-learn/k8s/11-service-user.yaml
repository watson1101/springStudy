# ===================================================================
# service-user: 用户 + SSO 认证服务
#   端口 8001，ClusterIP 内部可见
#   鉴权 + SQL 读写，比 gateway 稍重
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-user
  namespace: ms-learn
  labels:
    app: service-user
    tier: backend
    part-of: ms-learn
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: service-user
  template:
    metadata:
      labels:
        app: service-user
        tier: backend
        part-of: ms-learn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: service-user
          image: localhost:5000/ms-learn/service-user:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/ms_ds_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: ms-learn-common
            - secretRef:
                name: ms-learn-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8001
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8001
            initialDelaySeconds: 70
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 理由：鉴权+SQL，比 gateway 稍重
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service-user
  namespace: ms-learn
  labels:
    app: service-user
    part-of: ms-learn
spec:
  type: ClusterIP
  selector:
    app: service-user
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
