# ===================================================================
# service-transaction: 交易/支付模拟服务
#   端口 8004，ClusterIP 内部可见
#   2s 延时模拟支付完成 + Feign 调用 service-points 积分
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-transaction
  namespace: ms-learn
  labels:
    app: service-transaction
    tier: backend
    part-of: ms-learn
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: service-transaction
  template:
    metadata:
      labels:
        app: service-transaction
        tier: backend
        part-of: ms-learn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: service-transaction
          image: localhost:5000/ms-learn/service-transaction:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/ms_ds_transaction?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: ms-learn-common
            - secretRef:
                name: ms-learn-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8004
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8004
            initialDelaySeconds: 70
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 理由：2s 延时任务 + 积分 Feign；整体资源档与 user 一致
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service-transaction
  namespace: ms-learn
  labels:
    app: service-transaction
    part-of: ms-learn
spec:
  type: ClusterIP
  selector:
    app: service-transaction
  ports:
    - name: http
      port: 8004
      targetPort: http
      protocol: TCP
