# 公共非敏感配置 ConfigMap
# 说明：所有服务共享的基础连接信息，通过 envFrom.configMapRef 注入
# 敏感值（密码/Token）一律走 02-app-secret.yaml Secret，不放这里
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-learn-common
  namespace: ms-learn
  labels:
    app.kubernetes.io/part-of: ms-learn
data:
  # ---------- Nacos (服务注册 + 配置中心) ----------
  # Nacos 仍运行在宿主机 Docker (192.168.0.27:8848)，K8s Pod 通过宿主机 IP 访问
  SPRING_CLOUD_NACOS_SERVER_ADDR: "192.168.0.27:8848"
  NACOS_NAMESPACE: "public"
  NACOS_GROUP: "DEFAULT_GROUP"

  # ---------- MySQL (数据层) ----------
  # 8 个微服务对应 7 个数据库：
  #   ms_ds_user   (service-user)
  #   ms_ds_order  (service-order)
  #   ms_ds_product(service-product)
  #   ms_ds_transaction / ms_ds_points (服务独立)
  #   ms_ds_sys_config / OPENCLAW_A_STOCK (ms-ds-system)
  #   ms_ds_flowable (flowable-service)
  MYSQL_HOST: "192.168.0.27"
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: "root"

  # ---------- Sentinel (流量控制，可选) ----------
  # 参考 SENTINEL_K8S_DEPLOY.md，目前通过 NodePort 暴露 192.168.0.27:30858
  SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: "192.168.0.27:30858"

  # ---------- ms-ds-system 特性开关 ----------
  # 该服务会消费远程 192.168.0.40 binlog 同步 A股数据。
  # replicas=2 时两副本并行消费会重复写入/告警，默认关闭。
  # 若需要开启，请先 kubectl -n ms-learn scale deploy ms-ds-system --replicas=1 再置 true
  SYNC_A_STOCK_ENABLED: "false"

  # ---------- JVM 全局参数 ----------
  # 统一启动参数，与 -XX:MaxRAMPercentage=75.0 配合 cgroup limits 使用
  JAVA_OPTS_EXTRA: "-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"

  # ---------- Flowable 子引擎开关 ----------
  # 仅启用 process 流程引擎，其余子引擎默认关闭避免不必要的自动建表
  FLOWABLE_IDM_ENABLED: "false"
  FLOWABLE_EVENT_REGISTRY_ENABLED: "false"
  FLOWABLE_CMMN_ENABLED: "false"
  FLOWABLE_DMN_ENABLED: "false"
  FLOWABLE_FORM_ENABLED: "false"
  FLOWABLE_CONTENT_ENABLED: "false"
  FLOWABLE_APP_ENABLED: "false"
  FLOWABLE_PROCESS_DATABASE_SCHEMA_UPDATE: "true"
