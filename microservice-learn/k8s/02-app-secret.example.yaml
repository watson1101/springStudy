# 【模板，勿提交真实值到 Git】
# 使用方法：
#   cp k8s/02-app-secret.example.yaml k8s/02-app-secret.yaml
#   把所有 <REPLACE_ME> 替换为实际值后执行：
#   kubectl apply -f k8s/02-app-secret.yaml
#
# 校验：值必须是 base64 编码。本地执行命令获取 base64：
#   echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: ms-learn-secret
  namespace: ms-learn
  labels:
    app.kubernetes.io/part-of: ms-learn
type: Opaque
data:
  # MySQL root 密码（项目约定：123456）
  MYSQL_PASSWORD: "<REPLACE_ME_base64_of_123456>"

  # Nacos 控制台/API 用户名密码（服务器上默认 nacos / nacos）
  NACOS_USERNAME: "<REPLACE_ME_base64_of_nacos>"
  NACOS_PASSWORD: "<REPLACE_ME_base64_of_nacos>"

  # sa-token SSO 共享密钥 (service-user SSO server)
  SSO_SERVER_SECRET: "<REPLACE_ME_base64_of_dev-only-change-this-sso-server-secret>"
  SSO_CLIENT_SECRET: "<REPLACE_ME_base64_of_dev-only-change-this-sso-client-secret>"
