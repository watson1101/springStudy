# cart-service
server:
  port: 9010

spring:
  application:
    name: cart-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.2.10:8848
  datasource:
    database:
      postgres:
        host: 192.168.2.10
    url: jdbc:postgresql://${spring.datasource.database.postgres.host}:5432/item-service
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

logging:
  level:
    com.hong: debug
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

mybatis:
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.hong.domain
feign:
  okhttp:
    enabled: true # 启用okhttp连接池

