<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./vue.global.js"></script>

    <!-- <script src="https://unpkg.com/vue-router@4"></script> -->
    <title>page-1</title>
</head>

<body>
    <div id="counter">
        Counter: {{counter}} <br>
        message: {{message}}
    </div>

    <script>
        const Counter = {
            data(){
                return {
                    counter: 7,
                    message: "hello world"
                }
            }
        }
        Vue.createApp(Counter).mount('#counter')

    </script>

</body>

</html>
