server:
  port: 8010

spring:
  application:
    name: etl

  # Nacos服务发现配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: world-story
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        namespace: world-story
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
        username: nacos
        password: nacos

# ETL配置
etl:
  rest-port: 8081
  # 示例任务配置
  tasks:
    demo-task:
      name: demo-sync-task
      mode: FULL
      source:
        type: MYSQL
        host: localhost
        port: 3306
        database: source_db
        username: root
        password: 123456
      target:
        type: POSTGRESQL
        host: localhost
        port: 5432
        database: target_db
        username: postgres
        password: 123456
      tables:
        - sourceTable: users
          targetTable: users
          primaryKey: id
          columns: id,name,email,created_at
          filter: ""

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
