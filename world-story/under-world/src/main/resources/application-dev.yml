server:
  port: 8083

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://xxx.hong.com:5432/under_world
    username: postgres
    password: postgres
  redis:
    host: xxx.hong.com
    port: 6379
    database: 2
    timeout: 1800000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 5
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sentinel配置
spring:
  cloud:
    sentinel:
      transport:
        dashboard: xxx.hong.com:8858
      eager: true

# Feign配置
feign:
  sentinel:
    enabled: true

logging:
  level:
    com.hong.under: debug