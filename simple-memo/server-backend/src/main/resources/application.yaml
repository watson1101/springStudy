# ============================================================
# Simple Memo 应用配置文件
# 包含数据库、Redis、Sa-Token 等核心配置
# ============================================================
server:
  port: 8080

spring:
  application:
    name: simple-memo

  # 数据源配置 - MySQL（WSL 本地部署）
  datasource:
    url: jdbc:mysql://localhost:3306/simple-memo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池配置
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
  # Redis 配置（Sa-Token 用）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
  # 邮件配置（找回密码功能用）
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-auth-code
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径（自动扫描别名）
  type-aliases-package: hong.com.**.infrastructure.persistence
  # 全局配置
  global-config:
    db-config:
      # ID 策略：自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 是否打印 Banner
    banner: false
  configuration:
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 配置
sa-token:
  # Token 名称（同时也是 Cookie 名称）
  token-name: satoken
  # Token 有效期，单位秒，-1 代表永不过期
  timeout: 2592000
  # Token 最低活跃频率 单位秒，如果超过此时间没有访问则 Token 过期
  active-timeout: -1
  # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 Token
  is-share: true
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 日志配置
logging:
  level:
    root: info
    hong.com: debug
    com.baomidou.mybatisplus: debug
